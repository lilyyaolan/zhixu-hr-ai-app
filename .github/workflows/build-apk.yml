name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/zhixu-hr-ai-test.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhixu-hr-ai-apk
          path: dist/zhixu-hr-ai-test.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or update rolling test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-test
          name: "知序HR AI工作管家｜最新测试版"
          prerelease: true
          make_latest: false
          files: dist/zhixu-hr-ai-test.apk
          body: |
            这是自动生成的安卓测试版 APK。
            每次 main 分支更新后，本测试版会重新生成。
            正式销售前请不要把此测试版当作最终销售包。
          fail_on_unmatched_files: true
          overwrite_files: true
